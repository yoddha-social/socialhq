name: linter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Checks only: the old job ran the fixers (pint, prettier --write, eslint --fix),
      # so it could never fail.
      - name: Pint
        run: composer test:lint

      # Much of the TryPost base isn't Prettier/ESLint clean, so the frontend checks
      # cover the files this PR (or push) changes.
      - name: Changed frontend files
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD^; fi
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'resources/*.vue' 'resources/*.ts' 'resources/*.js' 'resources/*.css' > changed.txt
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      - name: Prettier
        if: steps.changed.outputs.count != '0'
        run: xargs -a changed.txt npx prettier --check

      - name: ESLint
        if: steps.changed.outputs.count != '0'
        run: grep -vE '\.css$' changed.txt | xargs -r npx eslint --no-warn-ignored
