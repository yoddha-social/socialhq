# Social HQ image: upstream's release workflow (release-docker.yml) with our
# trigger and build arguments. Upstream's own workflow only reacts to
# v*.*.* tags, which we never push, so the two don't collide.
#
# Release: git tag shq-v0.1.0 && git push origin shq-v0.1.0
# Repository variable SOCIALHQ_HOST (e.g. app.example.com) sets the live
# updates (Reverb) host compiled into the browser bundle.
name: Publish Social HQ image

# Builds the production image and publishes it to GitHub Container Registry
# (GHCR) on every version tag. amd64 and arm64 are built on native runners,
# then stitched into one multi-arch manifest — no QEMU emulation.

on:
  push:
    tags:
      - 'shq-v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Only a commit whose CI passed becomes an image: the `ci` check of
  # socialhq-ci.yml, which passes only when lint, backend, browser and
  # production-rules tests all passed. The tag usually follows a merge to main,
  # so wait for that run (up to 75 minutes) instead of failing while it is still
  # going. A commit from before socialhq-ci.yml has no `ci` check: tag a newer one.
  tested:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      checks: read
    steps:
      - name: Wait for the ci check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 75); do
            result=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci&filter=latest" \
              --jq '[.check_runs[] | (.conclusion // .status)] | first // "missing"')
            case "$result" in
              success) echo "CI passed for $SHA"; exit 0 ;;
              queued|in_progress|waiting|pending|requested|missing) ;;
              *) echo "::error::ci is '$result' for $SHA"; exit 1 ;;
            esac
            echo "Waiting for ci on $SHA (attempt $attempt)"
            sleep 60
          done
          echo "::error::ci did not pass for $SHA within 75 minutes"
          exit 1

  build:
    name: Build (${{ matrix.platform }})
    needs: [tested]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=Social HQ
            VITE_REVERB_APP_KEY=trypost-reverb-key
            VITE_REVERB_HOST=${{ vars.SOCIALHQ_HOST || 'localhost' }}
            VITE_REVERB_PORT=${{ vars.SOCIALHQ_HOST && '443' || '8080' }}
            VITE_REVERB_SCHEME=${{ vars.SOCIALHQ_HOST && 'https' || 'http' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # shq-v0.1.0 -> :0.1.0 (always pin an exact version; no "latest")
          tags: |
            type=match,pattern=shq-v(.*),group=1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
