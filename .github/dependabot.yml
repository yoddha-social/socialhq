# Dependency updates for Social HQ.
# Version updates arrive once a month, one grouped PR per ecosystem, to match
# the monthly security intake (.ai/skills/socialhq-security-intake).
# Security updates still open as soon as an advisory lands, grouped the same way.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
      composer:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/, /maizzle]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
