# Dependency advisories for Social HQ: composer audit and npm audit on every PR
# and weekly. A red run is the cue for the socialhq-security-intake skill.
name: socialhq audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: composer audit
        run: composer audit --locked --no-interaction

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Skills lint
        run: bin/socialhq-lint-skills
