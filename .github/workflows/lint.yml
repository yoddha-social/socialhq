name: linter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Checks only: the old job ran the fixers (pint, prettier --write, eslint --fix),
      # so it could never fail.
      - name: Pint
        run: composer test:lint

      # ESLint and vue-tsc resolve @/routes and @/actions, which Wayfinder generates.
      - name: Generate Wayfinder routes
        run: |
          cp .env.ci .env
          php artisan wayfinder:generate --with-form

      - name: ESLint
        run: npx eslint .

      - name: Type check
        run: npx vue-tsc --noEmit

      # Much of the TryPost base isn't Prettier-clean, and reformatting it would make
      # security cherry-picks conflict. Check the files this change touches, except
      # those that weren't clean before it.
      - name: Prettier (changed files)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD^; fi
          : > check.txt
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'resources/*.vue' 'resources/*.ts' 'resources/*.js' 'resources/*.css' |
            while read -r f; do
              if git cat-file -e "$BASE:$f" 2>/dev/null &&
                ! git show "$BASE:$f" | npx prettier --check --stdin-filepath "$f" >/dev/null 2>&1; then
                echo "Skipped (not Prettier-clean before this change): $f"
              else
                echo "$f" >> check.txt
              fi
            done
          if [ -s check.txt ]; then xargs -a check.txt npx prettier --check; fi
